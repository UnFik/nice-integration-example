# The SPA talks to NICE and to the services straight from the browser, so nginx only serves the build.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # index.html is never cached, so a new build shows at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # Vite puts a content hash in every file name under /assets/, so a file there never changes.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # A path with an extension is a file of the build or 404; any other path, /callback included, is the SPA.
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
