# Runs nadi (sharedservice-oauth: the backend, its UI and its PostgreSQL) next to a NICE stack that runs in Docker
# (`make up` in nice/).
#
#   docker compose up -d --build
#
# Open the UI at http://localhost:5181; the backend answers Bearer callers at http://localhost:8081. The
# confidential client of the UI needs the redirect URI http://localhost:5181/auth/callback, and NICE_CLIENT_ID and
# NICE_CLIENT_SECRET in sharedservice-oauth/backend/.env. Register the service in NICE as http://nadi:8081 (same
# network as NICE, resolved by name).
name: example

services:
  # Owns the network of nadi. The token issuer is http://localhost:8080 for NICE running on the
  # host, and the backend also uses it to fetch keys, to sign users in and to call NICE. Inside a
  # container localhost is the container itself, so this forwards localhost:8080 to NICE on nice-network.
  # The browser reaches NICE at the same http://localhost:8080. Dev only.
  nice-localhost:
    image: alpine/socat:1.8.0.3
    command: TCP-LISTEN:8080,fork,reuseaddr,bind=127.0.0.1 TCP:nice:8080
    restart: unless-stopped
    networks:
      nice-network:
        aliases: [nadi]
      nadi:
        aliases: [nadi]
    ports:
      - "127.0.0.1:8081:8081"

  nadi:
    build: ./sharedservice-oauth/backend
    env_file: ./sharedservice-oauth/backend/.env
    environment:
      LISTEN_ADDR: 0.0.0.0:8081
      JWKS_FILE: /data/jwks.json
      # The origin of nadi-web: the browser signs in and sends its writes there.
      PUBLIC_URL: http://localhost:5181
      # nadi-web serves the UI; this wins over WEB_DIR in .env.
      WEB_DIR: ""
      # The password only guards a database on the private network below, never published.
      DATABASE_URL: postgres://nadi:${NADI_DB_PASSWORD:-nadi-dev}@nadi-db:5432/nadi?sslmode=disable
    network_mode: service:nice-localhost
    depends_on:
      nice-localhost:
        condition: service_started
      nadi-db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - nadi-data:/data

  # The UI: nginx serves the build and passes /auth and /devices to nadi, so the browser sees one origin.
  nadi-web:
    build: ./sharedservice-oauth/web
    environment:
      BACKEND_ADDR: nadi:8081
    depends_on:
      nadi:
        condition: service_started
    restart: unless-stopped
    networks: [nadi]
    ports:
      - "127.0.0.1:5181:8080"

  # Items per organization and project. On its own network, so its name never clashes with a database
  # of the NICE stack on nice-network.
  nadi-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nadi
      POSTGRES_PASSWORD: ${NADI_DB_PASSWORD:-nadi-dev}
      POSTGRES_DB: nadi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadi -d nadi"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [nadi]
    volumes:
      - nadi-db:/var/lib/postgresql/data

volumes:
  nadi-data:
  nadi-db:

networks:
  nice-network:
    external: true
  nadi:
